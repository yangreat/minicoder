<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#0f172a"/>
  
  <!-- Header -->
  <rect width="1200" height="80" fill="#1e293b"/>
  <text x="40" y="40" font-family="Arial" font-size="28" fill="#f1f5f9" font-weight="bold">> MiniCoder Console</text>
  <text x="40" y="65" font-family="Arial" font-size="14" fill="#94a3b8">AI Coding Agent with Task Scheduling & State Management</text>
  
  <!-- Sidebar -->
  <rect x="0" y="80" width="400" height="720" fill="#1e293b"/>
  
  <!-- Task Input Panel -->
  <rect x="20" y="100" width="360" height="200" fill="#334155" rx="8"/>
  <text x="40" y="130" font-family="Arial" font-size="18" fill="#f1f5f9" font-weight="bold">New Task</text>
  <rect x="40" y="145" width="320" height="60" fill="#0f172a" rx="4"/>
  <text x="50" y="175" font-family="Arial" font-size="12" fill="#94a3b8">Fix the bug in calculator.py...</text>
  <rect x="40" y="220" width="320" height="35" fill="#3b82f6" rx="4"/>
  <text x="150" y="243" font-family="Arial" font-size="14" fill="white" font-weight="bold">Start Run</text>
  
  <!-- Run History -->
  <text x="40" y="340" font-family="Arial" font-size="18" fill="#f1f5f9" font-weight="bold">Run History</text>
  
  <!-- Run Item 1 -->
  <rect x="20" y="360" width="360" height="80" fill="#334155" rx="8"/>
  <rect x="30" y="370" width="60" height="20" fill="#10b981" rx="4"/>
  <text x="40" y="385" font-family="Arial" font-size="11" fill="white" font-weight="bold">DONE</text>
  <text x="100" y="385" font-family="Arial" font-size="10" fill="#94a3b8" font-family="monospace">a2efabf9</text>
  <text x="30" y="410" font-family="Arial" font-size="13" fill="#f1f5f9">Fix calculator divide-by-zero</text>
  <text x="30" y="428" font-family="Arial" font-size="10" fill="#94a3b8">5 steps " 234 tokens</text>
  
  <!-- Main Content Area -->
  <rect x="400" y="80" width="800" height="720" fill="#0f172a"/>
  
  <!-- Event Timeline -->
  <rect x="420" y="100" width="760" height="350" fill="#1e293b" rx="8"/>
  <text x="440" y="130" font-family="Arial" font-size="18" fill="#f1f5f9" font-weight="bold">Event Timeline</text>
  
  <!-- Event Items -->
  <rect x="440" y="150" width="720" height="60" fill="#334155" rx="4"/>
  <rect x="440" y="150" width="3" height="60" fill="#3b82f6"/>
  <text x="455" y="170" font-family="Arial" font-size="10" fill="#94a3b8">10:30:45</text>
  <text x="455" y="190" font-family="Arial" font-size="13" fill="#3b82f6" font-weight="bold">Tool Called: read_file</text>
  <text x="455" y="205" font-family="Arial" font-size="11" fill="#94a3b8">{"path": "calculator.py"}</text>
  
  <rect x="440" y="220" width="720" height="60" fill="#334155" rx="4"/>
  <rect x="440" y="220" width="3" height="60" fill="#10b981"/>
  <text x="455" y="240" font-family="Arial" font-size="10" fill="#94a3b8">10:30:46</text>
  <text x="455" y="260" font-family="Arial" font-size="13" fill="#10b981" font-weight="bold">Tool Result</text>
  <text x="455" y="275" font-family="Arial" font-size="11" fill="#94a3b8">Successfully read file (245 lines)</text>
  
  <!-- Diff Viewer -->
  <rect x="420" y="470" width="760" height="300" fill="#1e293b" rx="8"/>
  <text x="440" y="500" font-family="Arial" font-size="18" fill="#f1f5f9" font-weight="bold">Code Changes</text>
  
  <!-- Monaco Editor Mockup -->
  <rect x="440" y="520" width="360" height="220" fill="#1e1e1e" rx="4"/>
  <text x="450" y="540" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">def calculator(a, b, op):</text>
  <text x="450" y="560" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">    if op == "divide":</text>
  <text x="450" y="580" font-family="Consolas, monospace" font-size="11" fill="#f44747">-       return a / b</text>
  
  <rect x="810" y="520" width="360" height="220" fill="#1e1e1e" rx="4"/>
  <text x="820" y="540" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">def calculator(a, b, op):</text>
  <text x="820" y="560" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">    if op == "divide":</text>
  <text x="820" y="580" font-family="Consolas, monospace" font-size="11" fill="#4ec9b0">+       if b == 0:</text>
  <text x="820" y="600" font-family="Consolas, monospace" font-size="11" fill="#4ec9b0">+           raise ValueError(...)</text>
  <text x="820" y="620" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">        return a / b</text>
</svg>
