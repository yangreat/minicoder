<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- Note: This is a UI mockup showing the MiniCoder console interface -->
  
  <!-- Background -->
  <rect width="1200" height="900" fill="#0f172a"/>
  
  <!-- Mockup Label -->
  <rect x="10" y="10" width="130" height="30" fill="#f59e0b" rx="4"/>
  <text x="25" y="32" font-family="Arial" font-size="14" fill="white" font-weight="bold">UI MOCKUP</text>
  
  <!-- Header -->
  <rect y="50" width="1200" height="80" fill="#1e293b"/>
  <text x="40" y="90" font-family="Arial" font-size="28" fill="#f1f5f9" font-weight="bold">> MiniCoder Console</text>
  <text x="40" y="115" font-family="Arial" font-size="14" fill="#94a3b8">AI Coding Agent with Task Scheduling, State Management &amp; Real-time Streaming</text>
  
  <!-- Sidebar -->
  <rect y="130" width="400" height="770" fill="#1e293b"/>
  
  <!-- Task Input Panel -->
  <rect x="20" y="150" width="360" height="240" fill="#334155" rx="8"/>
  <text x="40" y="180" font-family="Arial" font-size="18" fill="#f1f5f9" font-weight="bold">New Task</text>
  <rect x="40" y="195" width="320" height="70" fill="#0f172a" rx="4"/>
  <text x="50" y="220" font-family="Arial" font-size="13" fill="#cbd5e1">Fix the divide-by-zero bug in calculator.py</text>
  <text x="50" y="240" font-family="Arial" font-size="13" fill="#cbd5e1">and ensure all tests pass.</text>
  
  <rect x="40" y="275" width="15" height="15" fill="#3b82f6" rx="2"/>
  <text x="62" y="287" font-family="Arial" font-size="12" fill="#f1f5f9">Demo Mode (Mock LLM)</text>
  
  <rect x="40" y="305" width="320" height="35" fill="#3b82f6" rx="4"/>
  <text x="145" y="328" font-family="Arial" font-size="14" fill="white" font-weight="bold">Start Run</text>
  
  <!-- Run History -->
  <text x="40" y="425" font-family="Arial" font-size="18" fill="#f1f5f9" font-weight="bold">Run History</text>
  
  <!-- Run Item 1 (Active) -->
  <rect x="20" y="445" width="360" height="95" fill="#3f4f64" rx="8" stroke="#3b82f6" stroke-width="2"/>
  <rect x="30" y="455" width="80" height="22" fill="#3b82f6" rx="4"/>
  <text x="38" y="472" font-family="Arial" font-size="11" fill="white" font-weight="bold">EXECUTING</text>
  <text x="120" y="472" font-family="Arial" font-size="10" fill="#94a3b8" font-family="monospace">b3e5f789</text>
  <text x="30" y="497" font-family="Arial" font-size="14" fill="#f1f5f9">Fix calculator divide-by-zero</text>
  <text x="30" y="517" font-family="Arial" font-size="11" fill="#94a3b8">3 steps " 156 tokens " running</text>
  
  <!-- Run Item 2 -->
  <rect x="20" y="550" width="360" height="95" fill="#334155" rx="8"/>
  <rect x="30" y="560" width="60" height="22" fill="#10b981" rx="4"/>
  <text x="40" y="577" font-family="Arial" font-size="11" fill="white" font-weight="bold">DONE</text>
  <text x="100" y="577" font-family="Arial" font-size="10" fill="#94a3b8" font-family="monospace">a2ef12cd</text>
  <text x="30" y="602" font-family="Arial" font-size="14" fill="#f1f5f9">Add input validation</text>
  <text x="30" y="622" font-family="Arial" font-size="11" fill="#94a3b8">8 steps " 421 tokens " 5 min ago</text>
  
  <!-- Main Content Area -->
  <rect x="400" y="130" width="800" height="770" fill="#0f172a"/>
  
  <!-- Event Timeline -->
  <rect x="420" y="150" width="760" height="220" fill="#1e293b" rx="8"/>
  <rect x="440" y="170" width="720" height="30" fill="none"/>
  <text x="440" y="190" font-family="Arial" font-size="18" fill="#f1f5f9" font-weight="bold">Event Timeline</text>
  <rect x="620" y="175" width="80" height="22" fill="#3b82f6" rx="4"/>
  <text x="628" y="192" font-family="Arial" font-size="10" fill="white" font-weight="bold">EXECUTING</text>
  <text x="710" y="192" font-family="Arial" font-size="11" fill="#94a3b8">3 steps</text>
  
  <!-- Event 1 -->
  <rect x="440" y="210" width="720" height="50" fill="#334155" rx="4"/>
  <rect x="440" y="210" width="3" height="50" fill="#3b82f6"/>
  <text x="455" y="230" font-family="Arial" font-size="10" fill="#94a3b8">10:45:12</text>
  <text x="455" y="248" font-family="Arial" font-size="13" fill="#3b82f6" font-weight="bold">Tool Called: read_file</text>
  
  <!-- Event 2 -->
  <rect x="440" y="265" width="720" height="50" fill="#334155" rx="4"/>
  <rect x="440" y="265" width="3" height="50" fill="#10b981"/>
  <text x="455" y="285" font-family="Arial" font-size="10" fill="#94a3b8">10:45:13</text>
  <text x="455" y="303" font-family="Arial" font-size="13" fill="#10b981" font-weight="bold">Tool Result: Success (245 lines)</text>
  
  <!-- Event 3 -->
  <rect x="440" y="320" width="720" height="40" fill="#334155" rx="4"/>
  <rect x="440" y="320" width="3" height="40" fill="#3b82f6"/>
  <text x="455" y="338" font-family="Arial" font-size="10" fill="#94a3b8">10:45:14</text>
  <text x="455" y="353" font-family="Arial" font-size="13" fill="#3b82f6" font-weight="bold">Tool Called: apply_patch</text>
  
  <!-- Task DAG -->
  <rect x="420" y="385" width="760" height="195" fill="#1e293b" rx="8"/>
  <text x="440" y="415" font-family="Arial" font-size="18" fill="#f1f5f9" font-weight="bold">Task Dependency Graph</text>
  
  <text x="870" y="415" font-family="Arial" font-size="11" fill="#94a3b8">Legend:</text>
  <circle cx="940" cy="410" r="5" fill="#10b981"/>
  <text x="950" y="415" font-family="Arial" font-size="10" fill="#94a3b8">Done</text>
  <circle cx="1010" cy="410" r="5" fill="#3b82f6"/>
  <text x="1020" y="415" font-family="Arial" font-size="10" fill="#94a3b8">Running</text>
  <circle cx="1090" cy="410" r="5" fill="#94a3b8"/>
  <text x="1100" y="415" font-family="Arial" font-size="10" fill="#94a3b8">Pending</text>
  
  <!-- Task Node 1 -->
  <rect x="450" y="435" width="190" height="55" fill="#0f172a" stroke="#10b981" stroke-width="3" rx="6"/>
  <text x="465" y="457" font-family="Arial" font-size="13" fill="#f1f5f9" font-weight="bold">Analyze Requirements</text>
  <text x="465" y="475" font-family="Arial" font-size="10" fill="#64748b">Priority: 3 | Done</text>
  
  <!-- Task Node 2 -->
  <rect x="680" y="435" width="190" height="55" fill="#0f172a" stroke="#3b82f6" stroke-width="3" rx="6"/>
  <text x="695" y="457" font-family="Arial" font-size="13" fill="#f1f5f9" font-weight="bold">Implement Fix</text>
  <text x="695" y="475" font-family="Arial" font-size="10" fill="#64748b">Priority: 2 | Running</text>
  
  <!-- Task Node 3 -->
  <rect x="910" y="435" width="190" height="55" fill="#0f172a" stroke="#94a3b8" stroke-width="3" rx="6"/>
  <text x="925" y="457" font-family="Arial" font-size="13" fill="#f1f5f9" font-weight="bold">Run Tests</text>
  <text x="925" y="475" font-family="Arial" font-size="10" fill="#64748b">Priority: 1 | Pending</text>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
  </defs>
  <line x1="640" y1="462" x2="680" y2="462" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="870" y1="462" x2="910" y2="462" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Diff Viewer -->
  <rect x="420" y="595" width="760" height="295" fill="#1e293b" rx="8"/>
  <text x="440" y="625" font-family="Arial" font-size="18" fill="#f1f5f9" font-weight="bold">Code Changes</text>
  
  <!-- Action Buttons -->
  <rect x="930" y="608" width="100" height="32" fill="#10b981" rx="4"/>
  <text x="945" y="630" font-family="Arial" font-size="13" fill="white" font-weight="bold"> Approve</text>
  
  <rect x="1040" y="608" width="130" height="32" fill="#ef4444" rx="4"/>
  <text x="1050" y="630" font-family="Arial" font-size="13" fill="white" font-weight="bold"> Rollback</text>
  
  <!-- Monaco Diff - Before -->
  <rect x="440" y="655" width="350" height="215" fill="#1e1e1e" rx="4"/>
  <text x="450" y="675" font-family="Consolas,monospace" font-size="11" fill="#d4d4d4">1  def calculator(a, b, op):</text>
  <text x="450" y="695" font-family="Consolas,monospace" font-size="11" fill="#d4d4d4">2      if op == "divide":</text>
  <text x="450" y="715" font-family="Consolas,monospace" font-size="11" fill="#f44747">3 -        return a / b</text>
  <text x="450" y="735" font-family="Consolas,monospace" font-size="11" fill="#d4d4d4">4      else:</text>
  <text x="450" y="755" font-family="Consolas,monospace" font-size="11" fill="#d4d4d4">5          raise ValueError(</text>
  <text x="450" y="775" font-family="Consolas,monospace" font-size="11" fill="#d4d4d4">6              f"Unknown: {op}"</text>
  <text x="450" y="795" font-family="Consolas,monospace" font-size="11" fill="#d4d4d4">7          )</text>
  
  <!-- Monaco Diff - After -->
  <rect x="800" y="655" width="370" height="215" fill="#1e1e1e" rx="4"/>
  <text x="810" y="675" font-family="Consolas,monospace" font-size="11" fill="#d4d4d4">1  def calculator(a, b, op):</text>
  <text x="810" y="695" font-family="Consolas,monospace" font-size="11" fill="#d4d4d4">2      if op == "divide":</text>
  <text x="810" y="715" font-family="Consolas,monospace" font-size="11" fill="#4ec9b0">3 +        if b == 0:</text>
  <text x="810" y="735" font-family="Consolas,monospace" font-size="11" fill="#4ec9b0">4 +            raise ValueError(</text>
  <text x="810" y="755" font-family="Consolas,monospace" font-size="11" fill="#4ec9b0">5 +                "Cannot divide by zero"</text>
  <text x="810" y="775" font-family="Consolas,monospace" font-size="11" fill="#4ec9b0">6 +            )</text>
  <text x="810" y="795" font-family="Consolas,monospace" font-size="11" fill="#d4d4d4">7          return a / b</text>
  <text x="810" y="815" font-family="Consolas,monospace" font-size="11" fill="#d4d4d4">8      else:</text>
  <text x="810" y="835" font-family="Consolas,monospace" font-size="11" fill="#d4d4d4">9          raise ValueError(...</text>
</svg>
